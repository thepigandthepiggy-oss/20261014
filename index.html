<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <!-- 讓網頁可以正確配合電腦、平板與手機尺寸 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- 手機瀏覽器網址列顏色 -->
  <meta name="theme-color" content="#f2e9e4">

  <meta name="description" content="p5.js 指令選擇題測驗，題庫來自 Google 試算表或 questions.csv">

  <title>p5.js 指令選擇題測驗</title>

  <!-- Google Fonts 字型設定 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Iansui&family=LXGW+WenKai+Mono+TC&family=LXGW+WenKai+TC&family=Yusei+Magic&display=swap"
    rel="stylesheet"
  >

  <!-- 網頁基本樣式 -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2e9e4;
      /* 避免手機長按或雙擊時選取文字、縮放畫面 */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family:
        "LXGW WenKai TC",
        "Iansui",
        sans-serif;
      color: #3d405b;
    }

    canvas {
      display: block;
    }

    /* 瀏覽器停用 JavaScript 時顯示的提示 */
    noscript {
      display: block;
      padding: 24px;
      text-align: center;
      font-size: 18px;
    }
  </style>

  <!-- 載入 p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>
</head>

<body>
  <noscript>此測驗需要啟用 JavaScript 才能使用。</noscript>

  <!-- 載入主要 p5.js 程式（題庫設定請看 sketch.js 的 GOOGLE_SHEET_CSV_URL） -->
  <script src="sketch.js"></script>
</body>
</html>
